<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نموذج تطوع - جمعية رسالة</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f5ff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .container { max-width: 600px; width: 100%; }
    form {
      background-color: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      border: 2px solid #3f51b5;
    }
    h1 {
      color: #3f51b5;
      text-align: center;
      margin-bottom: 30px;
      font-size: 24px;
      font-weight: 600;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #3f51b5;
      font-weight: 500;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 20px;
      border: 1px solid #bdc3c7;
      border-radius: 5px;
      box-sizing: border-box;
      transition: border-color 0.3s ease;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #3f51b5;
    }
    input[type="submit"] {
      background-color: #3f51b5;
      color: white;
      cursor: pointer;
      font-size: 18px;
      font-weight: bold;
      padding: 12px;
      border: none;
    }
    input[type="submit"]:hover {
      background-color: #f44336;
      transform: translateY(-3px);
    }
    .notification {
      background-color: #e8eaf6;
      border-radius: 5px;
      padding: 15px;
      margin-top: 30px;
      text-align: center;
      color: #3f51b5;
      font-size: 16px;
      font-weight: bold;
      display: none;
      white-space: pre-line;
    }
  </style>
</head>
<body>
  <div class="container">
    <form id="volunteerForm">
      <h1>نموذج التطوع</h1>

      <label for="fullName">الاسم رباعي:</label>
      <input type="text" id="fullName" required>

      <label for="phone">رقم الهاتف:</label>
      <input type="tel" id="phone" required>

      <label for="governorate">المحافظة:</label>
      <input type="text" id="governorate" required>

      <label for="address">العنوان:</label>
      <input type="text" id="address" required>

      <label for="activity">اختر النشاط التطوعي:</label>
      <select id="activity" required>
        <option value="">اختر نشاطاً</option>
        <option value="مساعدات">مساعدات</option>
        <option value="معارض">معارض</option>
        <option value="ميديا">ميديا</option>
        <option value="زكاة عقل">زكاة عقل</option>
        <option value="مكفوفين">مكفوفين</option>
        <option value="انقاذ حياة">انقاذ حياة</option>
        <option value="قوافل">قوافل</option>
        <option value="دعايا">دعايا</option>
      </select>

      <label for="reason">سبب اختيارك لهذا النشاط:</label>
      <textarea id="reason" rows="4"></textarea>

      <input type="submit" value="إرسال الطلب">
      <div class="notification" id="notification"></div>
    </form>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD7GJCzddDLE6B62HRnUY8x02xhq0vju6A",
      authDomain: "resala-12132.firebaseapp.com",
      projectId: "resala-12132",
      storageBucket: "resala-12132.appspot.com",
      messagingSenderId: "630917202997",
      appId: "1:630917202997:web:ceeb420ab7ae242583dd7c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const form = document.getElementById("volunteerForm");
    const notification = document.getElementById("notification");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const phone = document.getElementById("phone").value;
      const phoneRegex = /^01[0-2,5]{1}[0-9]{8}$/;
      if (!phoneRegex.test(phone)) {
        alert("يرجى إدخال رقم هاتف مصري صحيح.");
        return;
      }

      const data = {
        fullName: document.getElementById("fullName").value,
        phone,
        governorate: document.getElementById("governorate").value,
        address: document.getElementById("address").value,
        activity: document.getElementById("activity").value,
        reason: document.getElementById("reason").value,
        type: "volunteer",
        createdAt: serverTimestamp()
      };

      try {
        await addDoc(collection(db, "volunteers"), data);
        notification.style.display = "block";
        notification.innerText = "🌟 تم تسجيل طلبك بنجاح!\nسنتواصل معك قريباً.\n\nشكراً لك ❤️";
        form.reset();
      } catch (error) {
        alert("حدث خطأ أثناء الحفظ. حاول مرة أخرى.");
        console.error(error);
      }
    });
  </script>
</body>
</html>
